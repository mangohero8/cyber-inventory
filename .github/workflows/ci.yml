name: CI

# WHEN THIS RUNS
#
# On pull requests, this is the peer-review gate: reviewers see a green or red
# check before they read a line of code. On pushes to main it runs again,
# because a PR is tested against its own branch and main may have moved since
# -- two individually-passing PRs can still break main when combined.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs. Push three times in five minutes and only the last
# run survives, instead of three runs competing for runners while you wait on
# results you no longer care about.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, set explicitly.
#
# The default token permissions are broader than this job needs. A compromised
# dependency running inside your workflow inherits whatever the token can do,
# so read-only-by-default is the difference between a scare and an incident.
# Individual jobs widen this only when they must.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ------------------------------------------------------------------------
  # Job 1: code quality. Fast, so it fails fast.
  # ------------------------------------------------------------------------
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a hung job otherwise burns runner minutes for hours

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # Caches pip downloads between runs, keyed on the requirements
          # files. Typically turns a 40-second install into about 5.
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .
        # --output-format=github makes GitHub annotate the offending lines
        # directly in the PR diff, instead of burying them in a log nobody
        # opens.

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        # if: always() -- keep the report even when tests fail. That is
        # precisely the run where you want to inspect it.
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ------------------------------------------------------------------------
  # Job 2: container build, provenance verification, vulnerability scan.
  # ------------------------------------------------------------------------
  container:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: quality  # don't waste a build on code that failed its tests
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Record build timestamp
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false            # CI proves it builds; CD pushes it
          load: true             # load into the local daemon so we can run it
          tags: cyber-inventory:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          # GitHub Actions cache for Docker layers. Without this every CI run
          # reinstalls every dependency from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------------------
      # THE TRACEABILITY TEST.
      #
      # Start the image we just built, ask it what commit it is, and assert
      # the answer equals the commit that triggered this workflow.
      #
      # This is the whole commit-to-production chain, verified automatically.
      # Without it, provenance can silently break -- a renamed build arg, a
      # dropped ENV -- and nothing else in the pipeline would notice, until
      # the day you are debugging an incident and /version says "unknown".
      # ------------------------------------------------------------------
      - name: Verify build provenance
        run: |
          set -euo pipefail
          docker run -d --name probe -p 8080:8080 cyber-inventory:ci

          # Poll rather than `sleep 10`. A fixed sleep is either too short
          # (flaky) or too long (slow), and it is never right on both the
          # fastest and slowest runner.
          for i in $(seq 1 30); do
            if curl -sf localhost:8080/healthz >/dev/null 2>&1; then
              echo "container is up after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::container never became healthy"
              docker logs probe
              exit 1
            fi
            sleep 1
          done

          echo "--- /version ---"
          curl -sf localhost:8080/version | tee version.json
          echo ""

          REPORTED=$(python3 -c "import json;print(json.load(open('version.json'))['commit'])")
          echo "reported: $REPORTED"
          echo "expected: ${{ github.sha }}"

          if [ "$REPORTED" != "${{ github.sha }}" ]; then
            echo "::error::provenance mismatch -- the traceability chain is broken"
            exit 1
          fi
          echo "provenance verified"

          docker rm -f probe

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: cyber-inventory:ci
          format: table
          # Fail the build on HIGH or CRITICAL findings.
          exit-code: "1"
          severity: HIGH,CRITICAL
          # Only flag things you can actually act on. A CVE with no available
          # patch cannot be fixed by this repo, and a scanner that reports
          # unfixable findings on every run trains people to ignore it --
          # which costs you the real findings too.
          ignore-unfixed: true

      - name: Scan filesystem for secrets and dependency CVEs
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          scanners: vuln,secret
