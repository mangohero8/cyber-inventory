name: Deploy

# Deploys to Cloud Run on every push to main, after CI has passed.
#
# Separate workflow from ci.yml on purpose: CI runs on pull requests from
# anywhere and must never hold deploy credentials. This workflow runs only on
# main, and is the only place `id-token: write` appears.

on:
  push:
    branches: [main]
  # Manual trigger, for redeploying without an empty commit.
  workflow_dispatch:

# Never run two deploys at once. Without this, two quick merges race and the
# older image can land last -- production ends up running the wrong commit,
# which is a genuinely confusing incident to debug.
concurrency:
  group: deploy-production
  cancel-in-progress: false   # let an in-flight deploy finish, don't kill it

permissions:
  contents: read
  # THIS is what makes keyless auth work. It lets the job request a
  # short-lived OIDC token from GitHub proving which repo and ref it is.
  # Google validates that token instead of accepting a stored key.
  id-token: write

jobs:
  deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - name: Check out the code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          # No credentials_json. No key file. GitHub proves its identity with
          # an OIDC token and receives an access token valid for minutes.
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Set up Docker Buildx
        # Required for `cache-to: type=gha`. Without it buildx uses the
        # default "docker" driver, which cannot export cache.
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349  # v3.7.1

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          BASE="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/cyber-inventory"
          # Tag with the full commit SHA, not just :latest.
          #
          # :latest is ambiguous -- it means "whatever was pushed most
          # recently", which is useless during an incident and impossible to
          # roll back to deterministically. The SHA tag means every image in
          # the registry is permanently identifiable, and rolling back is
          # deploying a specific earlier tag.
          echo "sha_tag=${BASE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "latest_tag=${BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355  # v6.10.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.latest_tag }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.tags.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy the candidate without sending production traffic to it.
      # The existing production revision continues serving 100% until every
      # candidate validation below succeeds.
      - name: Deploy candidate to Cloud Run
        id: deploy
        run: |
          set -euo pipefail

          gcloud run deploy cyber-inventory \
            --image="${{ steps.tags.outputs.sha_tag }}" \
            --region="${{ vars.GCP_REGION }}" \
            --platform=managed \
            --no-allow-unauthenticated \
            --invoker-iam-check \
            --service-account="${{ vars.GCP_RUNTIME_SA }}" \
            --set-env-vars="ENVIRONMENT=production" \
            --port=8080 \
            --cpu=1 \
            --memory=512Mi \
            --min-instances=0 \
            --max-instances=3 \
            --timeout=30s \
            --no-traffic \
            --quiet

          REVISION="$(gcloud run services describe cyber-inventory \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(status.latestCreatedRevisionName)')"

          if [ -z "${REVISION}" ]; then
            echo "::error::could not determine candidate revision"
            exit 1
          fi

          TAG="candidate-${GITHUB_RUN_ID}"

          gcloud run services update-traffic cyber-inventory \
            --region="${{ vars.GCP_REGION }}" \
            --update-tags="${TAG}=${REVISION}" \
            --quiet

          BASE_URL="$(gcloud run services describe cyber-inventory \
            --region="${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"

          # Cloud Run tagged URLs use:
          # https://TAG---SERVICE_HASH.a.run.app
          HOST="${BASE_URL#https://}"
          CANDIDATE_URL="https://${TAG}---${HOST}"

          echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "url=${BASE_URL}" >> "$GITHUB_OUTPUT"
          echo "candidate_url=${CANDIDATE_URL}" >> "$GITHUB_OUTPUT"

          echo "candidate revision: ${REVISION}"
          echo "candidate URL:      ${CANDIDATE_URL}"
          echo "production URL:     ${BASE_URL}"

      # WIF access-token authentication used for deployment is deliberately
      # separate from the audience-specific ID token used to invoke the
      # private candidate revision.
      - name: Authenticate for candidate smoke test
        id: candidate-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.candidate_url }}

      - name: Validate candidate before promotion
        run: |
          set -euo pipefail

          URL="${{ steps.deploy.outputs.candidate_url }}"
          ID_TOKEN="${{ steps.candidate-auth.outputs.id_token }}"
          AUTH_HEADER="Authorization: Bearer ${ID_TOKEN}"

          echo "--- candidate health ---"
          for i in $(seq 1 30); do
            if curl -sf -H "${AUTH_HEADER}" "${URL}/health" >/dev/null 2>&1; then
              echo "candidate healthy after attempt ${i}"
              break
            fi

            if [ "$i" -eq 30 ]; then
              echo "::error::candidate never became healthy"
              exit 1
            fi

            sleep 2
          done

          echo "--- candidate readiness ---"
          curl -sf -H "${AUTH_HEADER}" "${URL}/ready" | tee candidate-ready.json
          echo ""

          echo "--- candidate provenance ---"
          curl -sf -H "${AUTH_HEADER}" "${URL}/version" | tee candidate-version.json
          echo ""

          LIVE_COMMIT="$(python3 -c "import json; print(json.load(open('candidate-version.json'))['commit'])")"

          echo "candidate reports: ${LIVE_COMMIT}"
          echo "expected:          ${{ github.sha }}"

          if [ "${LIVE_COMMIT}" = "unknown" ]; then
            echo "::error::candidate reports no build provenance"
            exit 1
          fi

          if [ "${LIVE_COMMIT}" != "${{ github.sha }}" ]; then
            echo "::error::candidate provenance mismatch: ${LIVE_COMMIT}"
            exit 1
          fi

          echo "--- candidate functional check ---"

          SMOKE_HOST="smoke-${GITHUB_RUN_ID}"

          curl -sf -X POST "${URL}/api/v1/assets" \
            -H "${AUTH_HEADER}" \
            -H 'Content-Type: application/json' \
            -d "{\"hostname\":\"${SMOKE_HOST}\",\"ip_address\":\"10.0.0.1\",\"asset_type\":\"server\",\"owner\":\"ci\",\"criticality\":\"low\"}" \
            -o /dev/null

          curl -sf -H "${AUTH_HEADER}" "${URL}/api/v1/stats" >/dev/null

          echo "CANDIDATE VERIFIED: ${{ steps.deploy.outputs.revision }}"

      # Promotion occurs only after the candidate has passed startup,
      # readiness, provenance, and functional validation.
      - name: Promote candidate to production
        run: |
          set -euo pipefail

          gcloud run services update-traffic cyber-inventory \
            --region="${{ vars.GCP_REGION }}" \
            --to-revisions="${{ steps.deploy.outputs.revision }}=100" \
            --quiet

          echo "PROMOTED: ${{ steps.deploy.outputs.revision }}"

      - name: Authenticate for production verification
        id: production-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}

      - name: Verify production after promotion
        run: |
          set -euo pipefail

          URL="${{ steps.deploy.outputs.url }}"
          ID_TOKEN="${{ steps.production-auth.outputs.id_token }}"
          AUTH_HEADER="Authorization: Bearer ${ID_TOKEN}"

          echo "--- production health ---"
          curl -sf -H "${AUTH_HEADER}" "${URL}/health" >/dev/null

          echo "--- production readiness ---"
          curl -sf -H "${AUTH_HEADER}" "${URL}/ready" >/dev/null

          echo "--- production provenance ---"
          curl -sf -H "${AUTH_HEADER}" "${URL}/version" | tee production-version.json
          echo ""

          LIVE_COMMIT="$(python3 -c "import json; print(json.load(open('production-version.json'))['commit'])")"

          if [ "${LIVE_COMMIT}" != "${{ github.sha }}" ]; then
            echo "::error::production is serving ${LIVE_COMMIT}, expected ${{ github.sha }}"
            exit 1
          fi

          echo "PRODUCTION VERIFIED: serving ${{ github.sha }}"

      - name: Remove candidate tag
        if: always() && steps.deploy.outputs.tag != ''
        run: |
          set -euo pipefail

          gcloud run services update-traffic cyber-inventory \
            --region="${{ vars.GCP_REGION }}" \
            --remove-tags="${{ steps.deploy.outputs.tag }}" \
            --quiet

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Deployment"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| URL | ${{ steps.deploy.outputs.url }} |"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Image | \`${{ steps.tags.outputs.sha_tag }}\` |"
            echo ""
            echo "Roll back by deploying an earlier SHA tag:"
            echo '```'
            echo "gcloud run deploy cyber-inventory --image=<earlier-sha-tag> --region=${{ vars.GCP_REGION }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
